services:
  vault:
    # https://hub.docker.com/r/hashicorp/vault
    image: docker.io/hashicorp/vault
    restart: always
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      - approle_data:/vault/approle
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - ./scripts:/vault/scripts:ro
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    command: sh /vault/scripts/start-vault.sh
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status 2>&1 | grep -q 'Sealed.*false'"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
  vault-agent:
    # https://hub.docker.com/r/hashicorp/vault
    image: docker.io/hashicorp/vault
    restart: always
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_KV_PREFIX: secret
      VAULT_APP_PATH: app
      SECRET_FILE_MODE: "0444"
    command: sh /vault/scripts/start-agent.sh
    cap_add:
      - IPC_LOCK
    volumes:
      - ./config:/vault/config:ro
      - ./scripts:/vault/scripts:ro
      - approle_data:/vault/approle:ro
      - secrets_data:/secrets:rw
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/secrets/.ready"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
  app:
    # https://hub.docker.com/_/alpine
    image: docker.io/library/alpine
    restart: always
    command: >
      sh -c '
        echo "[app] Secrets loaded successfully:";
        ls -la /run/secrets;
        while true; do
          echo "[app] $$(date -Iseconds) Reading secrets from /run/secrets:";
          for f in /run/secrets/*; do
            [ -f "$$f" ] || continue;
            base="$$(basename "$$f")";
            echo "  - $$base (bytes: $$(wc -c < "$$f"))";
          done;
          sleep 30;
        done
      '
    volumes:
      - secrets_data:/run/secrets:ro
    depends_on:
      vault-agent:
        condition: service_healthy

volumes:
  vault_data:
  vault_logs:
  approle_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m"
  secrets_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m"